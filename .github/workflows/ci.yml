name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests, level validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Node 24: the storage tests use the built-in node:sqlite module.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck, lint, all Jest suites (incl. 60-level regression) and level validation.
      - name: Full check
        run: npm run check

      - name: App Store listing limits
        run: npm run check-listing
